<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 680" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff" />
  
  <!-- Title Header -->
  <text x="475" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1e3a8a">HostelEase - UML Use Case Diagram (Unit 4)</text>
  <text x="475" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b">Software Engineering Group 2 Project • System Boundary &amp; Actor Interactions</text>

  <!-- System Boundary Box -->
  <rect x="230" y="80" width="490" height="570" rx="12" fill="#f8fafc" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,4" />
  <rect x="230" y="80" width="220" height="32" rx="6" fill="#3b82f6" />
  <text x="340" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">HostelEase System Boundary</text>

  <!-- Actor 1: Student (Left) -->
  <g transform="translate(100, 240)">
    <circle cx="25" cy="20" r="15" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2" />
    <line x1="25" y1="35" x2="25" y2="70" stroke="#1d4ed8" stroke-width="2.5" />
    <line x1="0" y1="48" x2="50" y2="48" stroke="#1d4ed8" stroke-width="2.5" />
    <line x1="25" y1="70" x2="5" y2="105" stroke="#1d4ed8" stroke-width="2.5" />
    <line x1="25" y1="70" x2="45" y2="105" stroke="#1d4ed8" stroke-width="2.5" />
    <text x="25" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Student</text>
    <text x="25" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b">(Campus User)</text>
  </g>

  <!-- Actor 2: Hostel Administrator (Right Top) -->
  <g transform="translate(800, 160)">
    <circle cx="25" cy="20" r="15" fill="#fef3c7" stroke="#b45309" stroke-width="2" />
    <line x1="25" y1="35" x2="25" y2="70" stroke="#b45309" stroke-width="2.5" />
    <line x1="0" y1="48" x2="50" y2="48" stroke="#b45309" stroke-width="2.5" />
    <line x1="25" y1="70" x2="5" y2="105" stroke="#b45309" stroke-width="2.5" />
    <line x1="25" y1="70" x2="45" y2="105" stroke="#b45309" stroke-width="2.5" />
    <text x="25" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Hostel Admin</text>
    <text x="25" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b">(Hall Management)</text>
  </g>

  <!-- Actor 3: Paystack Sandbox (Right Mid) -->
  <g transform="translate(770, 370)">
    <rect x="0" y="0" width="110" height="55" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2" />
    <text x="55" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#047857">«External Service»</text>
    <text x="55" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#065f46">Paystack API</text>
  </g>

  <!-- Actor 4: SMS Gateway Sandbox (Right Bottom) -->
  <g transform="translate(770, 480)">
    <rect x="0" y="0" width="110" height="55" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <text x="55" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8">«External Service»</text>
    <text x="55" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">SMS Gateway</text>
  </g>

  <!-- USE CASES (Ellipses) -->
  <g id="uc1">
    <ellipse cx="460" cy="140" rx="130" ry="24" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
    <text x="460" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Browse &amp; Filter Hostels</text>
  </g>

  <g id="uc2">
    <ellipse cx="460" cy="210" rx="140" ry="25" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <text x="460" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8">Reserve Bed (15-min Lock)</text>
  </g>

  <g id="uc3">
    <ellipse cx="460" cy="285" rx="135" ry="24" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
    <text x="460" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Pay via Mobile Money Sandbox</text>
  </g>

  <g id="uc4">
    <ellipse cx="460" cy="360" rx="135" ry="24" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
    <text x="460" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Receive SMS Confirmation Ticket</text>
  </g>

  <g id="uc5">
    <ellipse cx="460" cy="435" rx="130" ry="24" fill="#ffffff" stroke="#b45309" stroke-width="2" />
    <text x="460" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Add New Room (CRUD)</text>
  </g>

  <g id="uc6">
    <ellipse cx="460" cy="510" rx="130" ry="24" fill="#ffffff" stroke="#b45309" stroke-width="2" />
    <text x="460" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Edit Room &amp; Status (CRUD)</text>
  </g>

  <g id="uc7">
    <ellipse cx="460" cy="585" rx="130" ry="24" fill="#ffffff" stroke="#b45309" stroke-width="2" />
    <text x="460" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Delete Room from Inventory</text>
  </g>

  <!-- RELATIONSHIP LINES -->
  <line x1="145" y1="280" x2="335" y2="145" stroke="#475569" stroke-width="1.8" />
  <line x1="145" y1="290" x2="320" y2="210" stroke="#1d4ed8" stroke-width="2" />
  <line x1="145" y1="300" x2="330" y2="285" stroke="#475569" stroke-width="1.8" />
  <line x1="145" y1="310" x2="330" y2="360" stroke="#475569" stroke-width="1.8" />

  <line x1="805" y1="230" x2="590" y2="145" stroke="#64748b" stroke-width="1.8" />
  <line x1="805" y1="245" x2="585" y2="435" stroke="#b45309" stroke-width="2" />
  <line x1="805" y1="255" x2="585" y2="510" stroke="#b45309" stroke-width="2" />
  <line x1="805" y1="265" x2="585" y2="585" stroke="#b45309" stroke-width="2" />

  <line x1="595" y1="290" x2="770" y2="390" stroke="#059669" stroke-width="2" stroke-dasharray="4,3" />
  <line x1="595" y1="365" x2="770" y2="505" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,3" />

  <path d="M 460 235 L 460 260" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3" />
  <polygon points="460,261 456,252 464,252" fill="#dc2626" />
  <text x="500" y="252" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">«include»</text>

  <path d="M 460 310 L 460 335" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3" />
  <polygon points="460,336 456,327 464,327" fill="#dc2626" />
  <text x="500" y="327" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">«include»</text>
</svg>
