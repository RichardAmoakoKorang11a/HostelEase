  <rect x="850" y="345" width="100" height="22" rx="4" fill="#10b981" />

  <!-- DIVIDER -->
  <line x1="50" y1="390" x2="950" y2="390" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- ROLE ROTATION SCHEDULE TABLE -->
  <text x="50" y="420" font-size="16" font-weight="bold" fill="#1e3a8a">Group 2: 3-Week Rotating Roles Matrix</text>

  <!-- Table Header -->
