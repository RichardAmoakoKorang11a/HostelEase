  <rect x="50" y="588" width="900" height="28" fill="#f8fafc" />
  <text x="65" y="607" font-size="11" font-weight="bold" fill="#1e293b">Sandra Otu (5240101415)</text>
  <text x="400" y="607" text-anchor="middle" font-size="11" fill="#2563eb">Documentation Lead</text>
  <text x="630" y="607" text-anchor="middle" font-size="11" fill="#b45309">Project Manager (PM)</text>
