  <text x="630" y="455" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Sprint 2 (Weeks 4–6)</text>
  <text x="830" y="455" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Sprint 3 (Weeks 7–8)</text>

