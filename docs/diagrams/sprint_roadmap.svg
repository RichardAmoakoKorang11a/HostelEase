  <rect x="50" y="558" width="900" height="28" fill="#ffffff" />
  <text x="65" y="577" font-size="11" font-weight="bold" fill="#1e293b">Ibrahim Mohammed (5240101414)</text>
  <text x="400" y="577" text-anchor="middle" font-size="11" fill="#2563eb">Database &amp; Architecture</text>
  <text x="630" y="577" text-anchor="middle" font-size="11" fill="#b45309">QA &amp; Tester Lead</text>
  <text x="830" y="577" text-anchor="middle" font-size="11" fill="#16a34a">Documentation Lead</text>

