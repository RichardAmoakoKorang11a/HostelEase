  <text x="400" y="487" text-anchor="middle" font-size="11" fill="#2563eb">Project Manager (PM)</text>
  <text x="630" y="487" text-anchor="middle" font-size="11" fill="#b45309">Lead Developer</text>
  <text x="830" y="487" text-anchor="middle" font-size="11" fill="#16a34a">QA &amp; Tester Lead</text>

