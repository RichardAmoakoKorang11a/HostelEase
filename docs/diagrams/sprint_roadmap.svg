  <!-- TIMELINE HEADER -->
  <g transform="translate(220, 80)">
    <rect x="0" y="0" width="730" height="35" rx="6" fill="#f1f5f9" />
    <text x="50" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">Week 1</text>
    <text x="140" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">Week 2</text>
    <text x="230" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">Week 3</text>
    <text x="320" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">Week 4</text>
    <text x="410" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">Week 5</text>
    <text x="500" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">Week 6</text>
    <text x="590" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">Week 7</text>
    <text x="680" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">Week 8</text>
  </g>

  <!-- SPRINTS ROW -->
  <!-- Sprint 1 -->
  <rect x="220" y="125" width="270" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
  <text x="355" y="144" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">Sprint 1: Foundation (Weeks 1–3)</text>

  <!-- Sprint 2 -->
  <rect x="495" y="125" width="270" height="28" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" />
  <text x="630" y="144" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">Sprint 2: Core Engine &amp; APIs (Weeks 4–6)</text>

  <!-- Sprint 3 -->
  <rect x="770" y="125" width="180" height="28" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text x="860" y="144" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">Sprint 3: QA &amp; Demo (Weeks 7–8)</text>

  <!-- DELIVERABLE BARS -->
  <!-- Task 1: SRS & UML Diagrams -->
  <text x="200" y="185" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">SRS &amp; UML Modeling (Unit 3, 4)</text>
  <rect x="220" y="170" width="180" height="22" rx="4" fill="#3b82f6" />

  <!-- Task 2: Relational DB Schema -->
  <text x="200" y="220" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">Database Schema (Unit 6)</text>
  <rect x="260" y="205" width="230" height="22" rx="4" fill="#3b82f6" />

  <!-- Task 3: 15-Min Concurrency Lock -->
  <text x="200" y="255" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">Concurrency Lock (Unit 6)</text>
  <rect x="495" y="240" width="180" height="22" rx="4" fill="#f59e0b" />

  <!-- Task 4: Paystack & SMS Sandbox -->
  <text x="200" y="290" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">Sandbox Integrations (Unit 5)</text>
  <rect x="540" y="275" width="225" height="22" rx="4" fill="#f59e0b" />

  <!-- Task 5: Automated Testing (Jest) -->
  <text x="200" y="325" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">Automated Testing &amp; QA (Unit 7)</text>
  <rect x="730" y="310" width="220" height="22" rx="4" fill="#10b981" />

