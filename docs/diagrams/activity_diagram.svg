<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 700" width="100%" height="100%" style="background:#ffffff; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e3a8a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="425" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e3a8a">HostelEase - UML Activity &amp; Stateflow Diagram (Unit 4)</text>
  <text x="425" y="52" text-anchor="middle" font-size="12" fill="#64748b">Lifecycle of a Room Reservation &amp; Concurrency Rollback Workflow</text>

  <!-- START NODE -->
  <circle cx="425" cy="85" r="14" fill="#1e293b" />
  <line x1="425" y1="99" x2="425" y2="130" stroke="#1e3a8a" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ACTION 1: Browse Catalog -->
  <g transform="translate(300, 130)" filter="url(#shadow)">
    <rect x="0" y="0" width="250" height="42" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" />
    <text x="125" y="26" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Browse Catalog &amp; Select Bed Space</text>
  </g>
  <line x1="425" y1="172" x2="425" y2="205" stroke="#1e3a8a" stroke-width="2" marker-end="url(#arrow)" />

  <!-- DECISION 1: Is Room Available? -->
  <g transform="translate(365, 205)">
    <polygon points="60,0 120,30 60,60 0,30" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)" />
    <text x="60" y="34" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">Available?</text>
  </g>

  <!-- Branch: NO -> Alert unavailable -->
  <path d="M 485 235 L 680 235 L 680 151 L 555 151" stroke="#dc2626" stroke-width="1.8" fill="none" marker-end="url(#arrow-red)" />
  <text x="560" y="225" font-size="11" font-weight="bold" fill="#dc2626">[No: Locked/Occupied]</text>

  <!-- Branch: YES -> Apply 15-min Lock -->
  <line x1="425" y1="265" x2="425" y2="305" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)" />
  <text x="435" y="288" font-size="11" font-weight="bold" fill="#059669">[Yes]</text>

  <!-- ACTION 2: Apply 15-min Concurrency Lock -->
  <g transform="translate(290, 305)" filter="url(#shadow)">
    <rect x="0" y="0" width="270" height="46" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2" />
    <text x="135" y="23" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">Acquire 15-Min Concurrency Lock</text>
    <text x="135" y="38" text-anchor="middle" font-size="10" fill="#78350f">State: LOCKED (Countdown Timer Active)</text>
  </g>
  <line x1="425" y1="351" x2="425" y2="385" stroke="#1e3a8a" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ACTION 3: Paystack Sandbox Checkout -->
  <g transform="translate(300, 385)" filter="url(#shadow)">
    <rect x="0" y="0" width="250" height="42" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" />
    <text x="125" y="26" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Prompt MoMo Sandbox Checkout</text>
  </g>
  <line x1="425" y1="427" x2="425" y2="460" stroke="#1e3a8a" stroke-width="2" marker-end="url(#arrow)" />

  <!-- DECISION 2: Payment Verified within 15 min? -->
  <g transform="translate(365, 460)">
    <polygon points="60,0 120,30 60,60 0,30" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)" />
    <text x="60" y="28" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">Paid in</text>
    <text x="60" y="40" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">15 mins?</text>
  </g>

  <!-- Branch: TIMEOUT (Rollback) -->
  <path d="M 365 490 L 150 490 L 150 328 L 285 328" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrow-red)" />
  <text x="210" y="480" font-size="11" font-weight="bold" fill="#dc2626">[Timeout: Expired]</text>
  <rect x="90" y="380" width="120" height="35" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" />
  <text x="150" y="402" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">Rollback to AVAILABLE</text>

  <!-- Branch: SUCCESS -> Finalize -->
  <line x1="425" y1="520" x2="425" y2="560" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)" />
  <text x="435" y="542" font-size="11" font-weight="bold" fill="#059669">[Payment Success]</text>

  <!-- ACTION 4: Finalize Booking & Send SMS -->
  <g transform="translate(290, 560)" filter="url(#shadow)">
    <rect x="0" y="0" width="270" height="50" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2" />
    <text x="135" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#065f46">Mark Room OCCUPIED &amp; Confirmed</text>
    <text x="135" y="41" text-anchor="middle" font-size="10" fill="#047857">Dispatch SMS Slip via Twilio/Hubtel API</text>
  </g>
  <line x1="425" y1="610" x2="425" y2="640" stroke="#1e3a8a" stroke-width="2" marker-end="url(#arrow)" />

  <!-- END NODE -->
  <g transform="translate(425, 655)">
    <circle cx="0" cy="0" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
    <circle cx="0" cy="0" r="8" fill="#1e293b" />
  </g>
</svg>

