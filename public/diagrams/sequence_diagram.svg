<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%" style="background:#ffffff; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e3a8a">HostelEase - UML Sequence Diagram (Unit 4)</text>
  <text x="500" y="52" text-anchor="middle" font-size="12" fill="#64748b">Asynchronous 15-Minute Concurrency Lock, Paystack Sandbox &amp; SMS Dispatch</text>

  <!-- LIFELINE HEADERS -->
  <!-- 1. Student -->
  <g transform="translate(40, 75)" filter="url(#shadow)">
    <rect x="0" y="0" width="100" height="36" rx="6" fill="#1e40af" />
    <text x="50" y="23" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Student</text>
  </g>
  <line x1="90" y1="111" x2="90" y2="660" stroke="#cbd5e1" stroke-width="1.8" stroke-dasharray="6,4" />

  <!-- 2. WebClient UI -->
  <g transform="translate(190, 75)" filter="url(#shadow)">
    <rect x="0" y="0" width="110" height="36" rx="6" fill="#2563eb" />
    <text x="55" y="23" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">WebClient (UI)</text>
  </g>
  <line x1="245" y1="111" x2="245" y2="660" stroke="#cbd5e1" stroke-width="1.8" stroke-dasharray="6,4" />

  <!-- 3. Express API -->
  <g transform="translate(350, 75)" filter="url(#shadow)">
    <rect x="0" y="0" width="120" height="36" rx="6" fill="#0891b2" />
    <text x="60" y="23" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Express Server</text>
  </g>
  <line x1="410" y1="111" x2="410" y2="660" stroke="#cbd5e1" stroke-width="1.8" stroke-dasharray="6,4" />

  <!-- 4. SQLite DB -->
  <g transform="translate(520, 75)" filter="url(#shadow)">
    <rect x="0" y="0" width="110" height="36" rx="6" fill="#475569" />
    <text x="55" y="23" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">SQLite Database</text>
  </g>
  <line x1="575" y1="111" x2="575" y2="660" stroke="#cbd5e1" stroke-width="1.8" stroke-dasharray="6,4" />

  <!-- 5. Paystack Sandbox -->
  <g transform="translate(680, 75)" filter="url(#shadow)">
    <rect x="0" y="0" width="120" height="36" rx="6" fill="#059669" />
    <text x="60" y="23" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Paystack Sandbox</text>
  </g>
  <line x1="740" y1="111" x2="740" y2="660" stroke="#cbd5e1" stroke-width="1.8" stroke-dasharray="6,4" />

  <!-- 6. SMS Gateway -->
  <g transform="translate(845, 75)" filter="url(#shadow)">
    <rect x="0" y="0" width="115" height="36" rx="6" fill="#7c3aed" />
    <text x="57" y="23" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">SMS Gateway</text>
  </g>
  <line x1="902" y1="111" x2="902" y2="660" stroke="#cbd5e1" stroke-width="1.8" stroke-dasharray="6,4" />

  <!-- INTERACTIONS (Step by Step) -->
  <!-- Step 1: Select Room -->
  <line x1="90" y1="140" x2="245" y2="140" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="165" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">1. Click "Lock &amp; Reserve Bed"</text>

  <!-- Step 2: POST /api/bookings/reserve -->
  <line x1="245" y1="175" x2="410" y2="175" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="325" y="167" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">2. POST /api/bookings/reserve</text>

  <!-- Step 3: Atomic Lock Check -->
  <line x1="410" y1="210" x2="575" y2="210" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="492" y="202" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">3. Atomic check: status == AVAILABLE</text>

  <!-- Step 4: Apply 15-min Lock in DB -->
  <line x1="410" y1="245" x2="575" y2="245" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="492" y="237" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">4. UPDATE rooms SET status='LOCKED'</text>

  <!-- Return Lock Confirmed -->
  <line x1="575" y1="275" x2="410" y2="275" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-dashed)" />
  <text x="492" y="267" text-anchor="middle" font-size="10" fill="#475569">Lock acquired (15m window)</text>

  <!-- Step 5: Initialize Paystack -->
  <line x1="410" y1="310" x2="740" y2="310" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-green)" />
  <text x="575" y="302" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">5. Initialize Payment (amount, reference)</text>

  <!-- Return Checkout Link -->
  <line x1="740" y1="345" x2="410" y2="345" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-dashed)" />
  <text x="575" y="337" text-anchor="middle" font-size="10" fill="#475569">Return checkoutUrl &amp; token</text>

  <!-- Return to Frontend -->
  <line x1="410" y1="380" x2="245" y2="380" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-dashed)" />
  <text x="325" y="372" text-anchor="middle" font-size="10" fill="#475569">JSON {reference, lockExpiresAt}</text>

  <!-- Step 6: Show Modal to Student -->
  <line x1="245" y1="410" x2="90" y2="410" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="165" y="402" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">6. Show 15-min Countdown Modal</text>

  <!-- Step 7: Student Clicks Pay -->
  <line x1="90" y1="450" x2="245" y2="450" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="165" y="442" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">7. Click "Pay with MoMo Sandbox"</text>

  <!-- Step 8: Complete Sandbox Payment -->
  <line x1="245" y1="485" x2="410" y2="485" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="325" y="477" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">8. POST /api/bookings/pay-sandbox</text>

  <!-- Step 9: Finalize in DB -->
  <line x1="410" y1="520" x2="575" y2="520" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="492" y="512" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">9. UPDATE room='OCCUPIED', booking='CONFIRMED'</text>

  <!-- Step 10: Dispatch SMS -->
  <line x1="410" y1="560" x2="902" y2="560" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)" />
  <text x="655" y="552" text-anchor="middle" font-size="11" font-weight="bold" fill="#6d28d9">10. sendSMS(studentPhone, "Booking #REF Confirmed")</text>

  <!-- SMS Delivery to Student -->
  <path d="M 902 590 L 90 590" stroke="#059669" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-green)" />
  <text x="496" y="582" text-anchor="middle" font-size="11" font-weight="bold" fill="#047857">11. SMS Delivered to Student Mobile Device</text>

  <!-- Step 12: Display pass on UI -->
  <line x1="410" y1="625" x2="245" y2="625" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="325" y="617" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b">12. Render Confirmed Pass</text>
</svg>

