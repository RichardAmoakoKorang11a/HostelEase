
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administrator Login - HostelEase</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>HostelEase</h1>
    <p>Administrator Portal</p>
</header>

<main>

    <section class="form-container">

        <h2>Administrator Login</h2>

        <p>Sign in to manage the HostelEase system.</p>

        <form action="../backend/admin_login.php" method="POST">

            <label for="email">Administrator Email</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter administrator email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login as Administrator
            </button>

        </form>

        <p>
            <a href="login.html">Student Login</a>
        </p>

    </section>

</main>

<footer>
    <p>&copy; 2026 HostelEase. All rights reserved.</p>
</footer>

</body>
</html>
